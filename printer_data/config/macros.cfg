#########################
# System Startup Macros #
#########################
[delayed_gcode STARTUP_FANS]
initial_duration: 1
gcode:
    SET_FANS_TO_30

################
# Print Macros #
################
## *** THINGS TO UNCOMMENT: ***
## Bed mesh (2 lines at 2 locations)
## Nevermore (if you have one)
## Z_TILT_ADJUST (For Trident only)
## QUAD_GANTRY_LEVEL (For V2.4 only)
## Beacon Contact logic (if you have one. 4 lines at 4 locations)

[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  {% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  # set status LED
  status_ready
  # run part cooling fan check
  PREFLIGHT_CHECK
  # turn on motor fans to 100%
  MOTOR_FANS_ON
  # turn on electronics enclosure fans to 100%
  SET_FANS_TO_100
  # Turn on filter fan
  Filter_Fan_Half

  ##  Uncomment for Beacon Contact (1 of 4 for beacon contact)
  SET_GCODE_OFFSET Z=0                                 # Set offset to 0

  # Clear any lingering pause states
  CLEAR_PAUSE

  # Home the printer, set absolute positioning and update the Stealthburner LEDs.
  STATUS_HOMING                                         # Set LEDs to homing-mode
  G28                                                   # Full home (XYZ)
  G90                                                   # Absolute position

  ##  Uncomment for bed mesh (1 of 2 for bed mesh)
  BED_MESH_CLEAR                                       # Clear old saved bed mesh (if any)

  # Check if the bed temp is higher than 90c - if so then trigger a heatsoak.
  {% if params.BED|int > 90 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
    STATUS_HEATING                                      # Set LEDs to heating-mode
    M106 S255                                           # Turn on the PT-fan

    ##  Uncomment if you have a Nevermore.
    #SET_PIN PIN=nevermore VALUE=1                      # Turn on the nevermore

    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
    M190 S{target_bed}                                  # Set the target temp for the bed
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber_wait}c"  # Display info on display
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber_wait}   # Waits for chamber temp

  # If the bed temp is not over 90c, then skip the heatsoak and just heat up to set temp with a 5 min soak
  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"           # Display info on display
    STATUS_HEATING                                      # Set LEDs to heating-mode
    G1 X{x_wait} Y{y_wait} Z15 F9000                    # Go to center of the bed
    M190 S{target_bed}                                  # Set the target temp for the bed
    SET_DISPLAY_TEXT MSG="Soak for 5 min"               # Display info on display
    G4 P300000                                          # Wait 5 min for the bedtemp to stabilize
  {% endif %}

  # Run a beacon auto calibrate
  AFC_BRUSH
  BEACON_AUTO_CALIBRATE  ; calibrate z offset and beacon model hot

  # Heat hotend to 150c. This helps with getting a correct Z-home.
  SET_DISPLAY_TEXT MSG="Hotend: 150c"                   # Display info on display
  M109 S150                                             # Heat hotend to 150c

  ##  Uncomment for Beacon contact (2 of 4 for beacon contact)
  G28 Z METHOD=CONTACT CALIBRATE=1                     # Calibrate z offset and beacon model

  ##  Uncomment for Trident (Z_TILT_ADJUST)
  SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
  STATUS_LEVELING                                      # Set LEDs to leveling-mode
  Z_TILT_ADJUST                                        # Level the printer via Z_TILT_ADJUST
  G28 Z                                                # Home Z again after Z_TILT_ADJUST

  ##  Uncomment for V2.4 (Quad gantry level AKA QGL)
  #SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
  #STATUS_LEVELING                                      # Set LEDs to leveling-mode
  #QUAD_GANTRY_LEVEL                                    # Level the printer via QGL
  #G28 Z                                                # Home Z again after QGL

  ##  Uncomment for bed mesh (2 of 2 for bed mesh)
  SET_DISPLAY_TEXT MSG="Bed mesh"                      # Display info on display
  STATUS_MESHING                                       # Set LEDs to bed mesh-mode
  BED_MESH_CALIBRATE                                   # Start the bed mesh (add ADAPTIVE=1) for adaptive bed mesh

  ## Uncomment for Beacon Contact (3 of 4 for beacon contact)
  G28 Z METHOD=CONTACT CALIBRATE=0                     # Calibrate z offset only with hot nozzle

  # Heat up the hotend up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"     # Display info on display
  STATUS_HEATING                                        # Set LEDs to heating-mode
  G1 X{x_wait} Y{y_wait} Z15 F9000                      # Go to center of the bed
  M107                                                  # Turn off partcooling fan
  M109 S{target_extruder}                               # Heat the hotend to set temp

  ##   Uncomment for Beacon Contact (4 of 4 for beacon contact)
  SET_GCODE_OFFSET Z=0.06                              # Add a little offset for hotend thermal expansion

  # AFC Stuff
  AFC_PARK 
  T{initial_tool} ; load intiial tool
  AFC_PARK

  # Get ready to print by doing a primeline and updating the LEDs
  SET_DISPLAY_TEXT MSG="Printer goes brr"               # Display info on display
  STATUS_PRINTING                                       # Set LEDs to printing-mode
  G0 X{x_wait - 50} Y4 F10000                           # Go to starting point
  G0 Z0.4                                               # Raise Z to 0.4
  G91                                                   # Incremental positioning 
  G1 X100 E20 F1000                                     # Primeline
  G90                                                   # Absolute position

[gcode_macro PRINT_END]
description: Safe end-of-print for BoxTurtle + Beacon
gcode:
  # Flush planner
  M400

  # Stop part cooling first; keep enclosure/filter as you prefer
  M107

  # Optional: small retract only if hot enough (prevents cold-extrude fault)
  {% if printer.extruder.temperature|float >= (printer.configfile.settings.extruder.min_extrude_temp|default(170)) %}
     G91
     G1 E-0.8 F1800
     G90
  {% endif %}

  # Safe Z-lift and park (only if homed)
  {% if printer.toolhead.homed_axes|lower == "xyz" %}
    SAVE_GCODE_STATE NAME=END_state
    G90
    {% set curz = printer.toolhead.position.z|float %}
    {% set lift = 5.0 %}
    G1 Z{ (curz + lift) | round(3) } F1200
    ; Present the bed/front-left (adjust to taste)
    G1 X0 Y0 F9000
    RESTORE_GCODE_STATE NAME=END_state MOVE=0
  {% endif %}

  # Clear active mesh if module loaded
  {% if printer.bed_mesh %} BED_MESH_CLEAR {% endif %}

  # Turn off heaters
  TURN_OFF_HEATERS

  # Optional: AFC hooks (enable if you want to park/unload at end)
  # - Keep these after TURN_OFF_HEATERS only if your AFC macros do not extrude
  # - If they might extrude, move them BEFORE TURN_OFF_HEATERS and guard with temperature
  AFC_PARK
  ; AFC_UNLOAD TOOL={printer.toolhead.extruder}

  # Stepper disable
  M84
  # Your enclosure/motor fan policy
  MOTOR_FANS_OFF
  SET_FANS_TO_30

  # Clear pause/notify ready
  CLEAR_PAUSE
  ; If you use a status macro or LEDs, call it here:
  STATUS_READY

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_PRINT_STATS_INFO STATE=CANCELED
    M400
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    MOTOR_FANS_OFF
    SET_FANS_TO_30
    G90 ; absolute positioning
    G0 Y0 ; move to Y minimum
    G0 X0 ; move to X minimum
    m84; turn off motors
    SET_FAN_SPEED FAN=Filter_Fan SPEED=0
    BASE_CANCEL_PRINT {rawparams}

##################################
# Tool Head Fan Pre Flight Check #
##################################
[gcode_macro PCF_CHECK]
description: sub-macro of PREFLIGHT CHECK, not intended to be used outside of parent macro
gcode:
  {% if printer.fan.rpm is not none %}
    {% if printer.fan.rpm > 500 %}
      {action_respond_info("Part fan self-test: PASS")}
    {% else %}
      CANCEL_PRINT
      {action_respond_info("Part fan self-test: FAIL!")}
    {% endif %}
  {% endif %}

[gcode_macro PREFLIGHT_CHECK]
description: Use before print startup, checks the part fan for failures
gcode:
  M106 S128 ; turn on the part fan
  G4 P2000  ; wait for the fan to spin up
  M400
  PCF_CHECK ; check part fan speed
  M106 S0   ; turn off the part fan


#####################
# Filter Fan Macros #
#####################
[gcode_macro Filter_Fan_On]
description: Turn on the filter fan.
gcode:
  M118 ** Turning Filter fan on
  SET_FAN_SPEED FAN=Filter_Fan SPEED=1

[gcode_macro Filter_Fan_Half]
description: Turn on the filter fan half speed.
gcode:
  M118 ** Turning filter fan on
  SET_FAN_SPEED FAN=Filter_Fan SPEED=0.25

[delayed_gcode filterfanoff]
gcode:
  M118 ** Turning off the Filter Fan
  SET_FAN_SPEED FAN=Filter_Fan SPEED=0
  status_part_ready

[delayed_gcode filterfan_10min_left]
gcode:
  M118 ** 10 minutes left for the Filter Fan

[delayed_gcode filterfan_5min_left]
gcode:
  M118 ** 5 minutes left for the Filter Fan

[gcode_macro Filter_Fan_Timer]
description: Turn on the filter fan for 15 minutes and provide time updates.
gcode:
  M118 ** Running the Filter Fan for 15 minutes
  status_cooling
  SET_FAN_SPEED FAN=Filter_Fan SPEED=1
  UPDATE_DELAYED_GCODE ID=filterfanoff DURATION=900
  UPDATE_DELAYED_GCODE ID=filterfan_10min_left DURATION=300
  UPDATE_DELAYED_GCODE ID=filterfan_5min_left DURATION=600

###############################
# Electronic Enclosure Macros #
###############################

[gcode_macro SET_FANS_TO_30]
gcode:
    SET_FAN_SPEED FAN=Front_Intake SPEED=0.30  # Set Left_Intake fan to 30%
    SET_FAN_SPEED FAN=Rear_Intake SPEED=0.30  # Set Right_Intake fan to 30%

[gcode_macro SET_FANS_TO_100]
gcode:
    SET_FAN_SPEED FAN=Front_Intake SPEED=1.00 # Set Left_Intake fan to 100%
    SET_FAN_SPEED FAN=Rear_Intake SPEED=1.00  # Set Right_Intake fan to 100%

####################
# Motor Fan Macros #
####################
[gcode_macro MOTOR_FANS_ON]
gcode:
    SET_FAN_SPEED FAN=Motor_Fans SPEED=1.00

[gcode_macro MOTOR_FANS_OFF]
gcode:
    SET_FAN_SPEED FAN=Motor_Fans SPEED=0

#######################
# Chamber Temperature #
#######################
[gcode_macro SET_CHAMBER_TEMPERATURE]
variable_target_temperature: 0
description: Set the chamber temperature target
gcode:
    {% set temperature = params.TEMPERATURE|default(0)|float %}
    M118 ** Setting chamber target temperature to {temperature}°C
    SET_GCODE_VARIABLE MACRO=WAIT_FOR_CHAMBER_TEMPERATURE VARIABLE=target_temperature VALUE={temperature}

[gcode_macro WAIT_FOR_CHAMBER_TEMPERATURE]
variable_target_temperature: 0
gcode:
  {% if target_temperature|int > 0 %}
    M118 Waiting for chamber to reach { target_temperature }°C
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={ target_temperature }
    M118 Chamber reached { target_temperature }°C
  {% else %}
    M118 No chamber temperature wait required
  {% endif %}

[gcode_macro WAIT_FOR_CHAMBER_NOTIFICATION]
variable_target_temperature: 0
gcode:
  {% if target_temperature|int > 0 %}
    M118 Waiting for chamber to reach { target_temperature }°C
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={ target_temperature }
    M118 Chamber reached { target_temperature }°C
    MR_NOTIFY TITLE="Chamber Temperature" MESSAGE="Chamber has reached the target temperature of { target_temperature }°C"
  {% else %}
    M118 No chamber temperature wait required
  {% endif %}

[gcode_macro ASA_PREHEAT]
gcode:
  status_heating
  M140 S100 # Set the bed temperature to 100°C
  M104 S100  ; Set hotend temperature to 100°C
  MOTOR_FANS_ON
  #Filter_Fan_On  # Turn on the filter fan for circulation
  #M106 S255    ; part cooling fan 100%
  G28 F3000  # Home the printer
  G0 X135.6 Y130 F3000 # Move to position (135.6, 130)
  G0 Z2 F3000  # Set Z to 2mm for beacon heatsoak
  SET_GCODE_VARIABLE MACRO=WAIT_FOR_CHAMBER_NOTIFICATION VARIABLE=target_temperature VALUE=40
  WAIT_FOR_CHAMBER_NOTIFICATION

[gcode_macro TPU_PREHEAT]
gcode:
  status_heating
  M140 S45 # Set the bed temperature to 100°C
  M104 S110  ; Set hotend temperature to 100°C
  MOTOR_FANS_ON
  Filter_Fan_On  # Turn on the filter fan for circulation
  G28 F3000  # Home the printer
  G0 X135.6 Y130 F3000 # Move to position (135.6, 130)
  G0 Z2 F3000  # Set Z to 2mm for beacon heatsoak

##################
# Klipper-Backup #
##################
[gcode_macro update_git]
description: Run a manual backup to github
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh $0"
timeout: 90.0
verbose: True

######################
# Custom Mobileraker #
# Notifications      #
######################
[gcode_macro MR_NOTIFY]
description: Allows you to send a custom notification via Mobileraker without using the M117 command
gcode:
    {% set msg = "MR_NOTIFY:" ~ (params.TITLE ~ "|" if 'TITLE' in params|upper else "") ~ params.MESSAGE %}
    {% if 'MESSAGE' in params|upper %}
        { action_respond_info(msg) }
    {% else %}
        { action_raise_error('Must provide MESSAGE parameter') }
    {% endif %}

[idle_timeout]
gcode:
timeout: 5400

[pause_resume]

[respond]

[virtual_sdcard]
path: ~/gcode_files # UPDATE THIS FOR YOUR PATH!!!
on_error_gcode: CANCEL_PRINT

[display_status]
    